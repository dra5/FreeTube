# This is a basic workflow that is manually triggered

name: Upload Release

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    inputs:
      releaseId:
        type: string
        required: true
        description: Release ID

cache-mode: none
permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]
        runtime:
          - win-x64
        include:
        - runtime: win-x64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    # Do not restore the pnpm cache, to avoid cache poisoning affecting releases
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
      with:
        version: 11
        cache: false

    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm run lint
      shell: bash

    - name: Get Version Number
      id: getPackageInfo
      shell: bash
      run: |
        jq --raw-output '"version=" + .version' package.json >> "$GITHUB_OUTPUT"

    - name: Install libarchive-tools
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt update
        sudo apt -y install libarchive-tools

    - name: Build x64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'x64')
      shell: bash
      run: pnpm run build

    - name: Build ARM64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'arm64')
      shell: bash
      run: pnpm run build:arm64

    - name: Add update information to AppImage
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
        APPIMAGE_ARCH: ${{ matrix.appimage-arch }}
      run: |
        update_info="gh-releases-zsync|FreeTubeApp|FreeTube|latest-all|freetube-*-${APPIMAGE_ARCH}.AppImage.zsync"

        cd build

        section_offset_hex="$(objdump --section-headers ./FreeTube-${VERSION}*.AppImage | awk '$2 == ".upd_info" { printf $6 }')"

        script='const fd = fs.openSync(process.argv[3], "r+"); fs.writeSync(fd, process.argv[2], parseInt(process.argv[1], 16)); fs.closeSync(fd)'

        node -e "$script" $section_offset_hex "$update_info" ./FreeTube-${VERSION}*.AppImage

        zsyncmake -u "freetube-${VERSION}-beta-${APPIMAGE_ARCH}.AppImage" ./FreeTube-${VERSION}*.AppImage

    - name: Upload Windows x64 .7z Release
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 #v1.0.2
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: https://uploads.github.com/repos/FreeTubeApp/FreeTube/releases/${{ inputs.releaseId }}/assets{?name,label}
        asset_name: freetube-${{ steps.getPackageInfo.outputs.version }}-beta-win-x64-portable.7z
        asset_path: build/freetube-${{ steps.getPackageInfo.outputs.version }}-win.7z
        asset_content_type: application/x-7z-compressed

